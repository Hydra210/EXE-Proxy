<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EXE Proxy</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="stars"></canvas>

  <main class="wrap">
    <h1 class="logo">EXE<span>Proxy</span></h1>
    <p class="tagline">Browse the web, unrestricted by your network.</p>

    <form id="go-form" class="bar" autocomplete="off">
      <input
        id="url-input"
        type="text"
        placeholder="Enter a URL or search term..."
        spellcheck="false"
      />
      <button type="submit">Go</button>
    </form>

    <div class="hint">e.g. wikipedia.org, github.com, youtube.com</div>
  </main>

  <footer>EXE Proxy</footer>

  <script src="script.js"></script>
</body>
</html>
